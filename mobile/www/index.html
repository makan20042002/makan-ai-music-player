  <!-- MAKAN Music Player Modular Components -->

  <script src="media/components/lyrics-style.js"></script>

  <script src="media/components/app-shell.js"></script>

  <!-- Mount Application -->
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var appEl = document.getElementById('app');
      if (appEl && window.MakanAppShell) {
        window.makanApp = new window.MakanAppShell(appEl);
        window.MakanApp = window.makanApp;
      }
    });
  </script>
  <script src="mobile/mobile-shell.js"></script>
